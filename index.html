
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Welcome to Student Registration Form</h1>
        <p class="description">Please fill in your details to register.</p>

        <form action="#" method="post" enctype="multipart/form-data">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Enter your full name" required>

            <label for="fatherName">Father's Name</label>
            <input type="text" id="fatherName" name="fatherName"
                   placeholder="Enter father's name" required>

            <label for="regNo">Registration Number</label>
            <input type="text" id="regNo" name="regNo"
                   placeholder="Enter registration number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="example@university.edu" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required minlength="8">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Confirm your password" required minlength="8">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>

            <label>Gender</label>
            <div class="gender-options">
                <label>
                    <input type="radio" name="gender" value="Male" required>
                    Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>
                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="BSSE">BSSE</option>
                <option value="BSAI">BSAI</option>
                <option value="BSDS">BSDS</option>
                <option value="BSCS">BSCS</option>
            </select>

            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
                <option value="">Select Semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
                <option value="3">3rd Semester</option>
                <option value="4">4th Semester</option>
                <option value="5">5th Semester</option>
                <option value="6">6th Semester</option>
                <option value="7">7th Semester</option>
                <option value="8">8th Semester</option>
            </select>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter phone number"
                   required>

            <label for="address">Permanent Address</label>
            <textarea id="address" name="address" rows="4"
                      placeholder="Enter your permanent address"
                      required></textarea>

            <label for="profile">Profile Picture</label>
            <input type="file" id="profile" name="profile"
                   accept="image/*" required>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms"
                       required>
                <label for="terms">
                    I agree to the Terms and Conditions.
                </label>
            </div>

            <div class="button-group">
                <button type="submit" class="register-btn">
                    Register
                </button>
                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>
    </div>

</body>
</html>
